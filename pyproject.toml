[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deciphercode"
version = "0.2.0"
description = "Give your legacy code a voice. LLM-powered codebase analysis and documentation generator."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "DecipherCode Contributors"},
]
keywords = ["cli", "documentation", "legacy-code", "llm", "code-analysis", "reverse-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1",
    "openai>=1.0",
    "anthropic>=0.30",
    "rich>=13.0",
    "gitpython>=3.1",
    "pyyaml>=6.0",
    "tiktoken>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
decipher = "decipher.cli:main"

[project.urls]
Homepage = "https://github.com/deciphercode/deciphercode"
Repository = "https://github.com/deciphercode/deciphercode"
Issues = "https://github.com/deciphercode/deciphercode/issues"

[tool.setuptools.packages.find]
include = ["decipher*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["decipher"]
omit = [
    "decipher/archaeologist.py",
    "decipher/diagrammer.py",
    "decipher/interactive.py",
    "decipher/readme_generator.py",
]

[tool.coverage.report]
fail_under = 80

[tool.mypy]
strict = true
